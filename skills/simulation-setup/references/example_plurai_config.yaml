# This file belongs to you. Plurai generated it from your agent as a starting point;
# review it, change it and keep it with your code.
# plurai.config.yaml — Complete simulation environment definition
# Generated by Claude Code plugin. Reviewed by developer.
# The Plurai backend reads this to generate domain-aware mocks.

workspace: acme
# …or, when this workspace declares WHO runs the commands, the mapping form:
#   workspace:
#     name: acme
#     run_driver: headless   # interactive (default) | headless — nobody at the terminal
# Under `headless` every scripted gate resolves to its declared default instead of asking, and a
# gate with no default files a typed `run_driver_input_required` finding rather than guessing.
# `PLURAI_SIM_NONINTERACTIVE=1` is an accepted alias; an explicit `run_driver: interactive` wins
# over it. Only `name` and `operator` are read — `verify_config.py` warns on any other sub-key.
project: billing-agent
anonymize: false  # env-scoped anonymization posture (raw default); true = ingest-* scrubs PII locally before upload, fail-closed on missing plurai-simulation-sdk[anonymize]/spaCy

# --- Scan time ---
# Written by derive_tool_facts.py --write, never by hand: when the scan ran.
scanned_at: '2026-07-15T09:12:00Z'

# --- Shape ---
# WHICH HOOK the runner drives: `dialog` (invoke_agent — a conversation) or `pipeline`
# (invoke_pipeline — one structured call in, one structured output out). Write it from Step 0a
# for BOTH shapes; a skill-agent bench declares `dialog`, because that is what it is at the
# protocol level. It lives here rather than in a `.run_mode`-style sidecar because it is the same
# fact in every clone of the repo, not a property of one workspace. The declaration is what
# dispatches; the hooks are a HINT that never chooses a route, so an older `invoke_agent` bench
# without the key is driven as a dialog and unaffected, while an `invoke_pipeline`-only bench
# without it has no hook the turn loop can drive and is refused — by the runner, and by
# verify_config.py, which also refuses a declaration that contradicts the hooks simulate.py binds.
# Only this ROOT key is read anywhere: a `shape:` under `agent:` is read by nobody.
shape: dialog

# --- Agent ---
agent:
  framework: langgraph
  module: our_backend.agents.billing
  graph_variable: graph
  state_class: AgentState
  checkpointer: memory
  entry_point: fetch_context
  # native_tools: [Skill, Bash]  # script-managed: record_native_tools.py writes it for a Claude Agent SDK agent only; never hand-edit it (see framework-patterns.md)
  # error_replies: [{text: "Sorry, something went wrong.", match: exact, cite: "agent/app.py:88"}]  # script-managed: record_error_replies.py reads the agent's error paths; never hand-edit it

# --- Agent context ---
# Fields the agent expects before turn 1.
agent_context:
  fields:
    user_id: { type: string, required: true, description: "UUID of the active user" }
    permissions: { type: "list[string]", required: true, description: "User's permissions" }
    user_profile: { type: dict, required: false, description: "Pre-loaded user profile, if available" }
    # STARTUP PRECONDITION example: state produced by a prior calibration/onboarding flow that a
    # main-agent tool requires. `precondition: true` is stronger than `required` (which only checks
    # presence — an empty [] passes): scenario generation MUST populate it non-empty + coherent, and
    # an empty value is hard-rejected at generation time. Describe the valid-value semantics you read
    # from the producing flow. Omit this field unless Step 4b detected such a precondition.
    onboarding_answers: { type: "list[dict]", required: true, precondition: true, description: "Onboarding Q&A the setup flow produces from the user's request; non-empty, consistent with the task." }
  context_nodes_replaced:
    - node: fetch_context
      original: "Reads user from Postgres by user_id, loads permissions from Redis"
      fields_populated: [user_id, user_profile, permissions]

# --- Knowledge ---
# A RECORD, NOT CONFIGURATION. Neither the backend nor the SDK reads this block — setting
# `prompt_inlined: true` inlines nothing, builds nothing, and changes no generation. It exists
# because two skills need the fact and had nowhere to read it: Step 9b (a closed, enumerable
# doc set owes a VERBATIM SOURCE APPENDIX, whether the docs ride in the system prompt or sit
# behind a retrieval tool) and /build-rag-corpus Step 1 (prompt-inlined knowledge still wants a
# corpus — there just isn't a retrieval tool to notice it by). Before this key, operators
# recorded it in YAML comments, where no skill can find it.
#
# Omit the whole block when the agent's knowledge is open-ended (a large or growing corpus
# nobody can enumerate) — an absent block says "not a closed set", which is the honest default.
knowledge:
  prompt_inlined: true         # the docs below are pasted into the system prompt at construction time
  closed_doc_set:              # the CLOSED set — every document the agent's answers may rest on
    - docs/refund_policy.md
    - docs/billing_faq.md
  notes: >-
    Pasted verbatim into the system prompt by our_backend.agents.billing.build_prompt().
    The help-center index behind rag_search is a SEPARATE, open-ended knowledge base and is
    deliberately not listed here.

# --- Render / action surface ---
# The client-side ACTIONS the agent emits that are NOT tool calls — UI renders (`show_table`,
# `show_image`), navigation, a hand-off verb. They never appear under `tools:` (there is no
# dispatch to mock), so a render-action agent declares `tools: {}` by design — and a surface
# declared nowhere typed is one no completeness check can see. This list IS the surface. The PRD's
# `## Agent facts` CLOSES it with a `tool_surface` / `RENDER_ACTIONS` / `omits` fact whose
# absence `check` names the verbs the agent does NOT have (references/agent_facts.md).
# lint_prd.py reads both (every declared verb documented; the closing fact present and not
# contradicting the list). The key is also read OFF THIS FILE by the backend and the SDK — see
# verify_config.py's `_KNOWN_ROOT_KEYS` note for who, and how a malformed list is refused. Always
# declare it: `render_actions: []` says "none, by declaration" and closes the callable surface.
render_actions: [show_invoice_table, show_receipt_image]

# --- Input surface (OPTIONAL) ---
# `render_actions:` above declares what the agent EMITS; this declares what it can be HANDED.
# `input:` lists the MESSAGE CONTENT PART kinds the agent accepts, spelled as OpenAI spells a
# content part's `type` — `text` (always: every turn carries the simulated user's words),
# `image_url` (a picture), `file` (a document handed to the turn). Anything outside that
# vocabulary is refused: it is the SDK's own list, so a kind it cannot put on a turn is one the
# smoke could never confirm.
# `may_open:` says whether this agent can be driven with NO user message on turn 0 — an agent that
# GREETS FIRST. Declare it only when `invoke_agent` really serves `{'messages': []}`; the smoke
# drives that empty opener and refuses a declaration the harness raises on.
# `opens: always` (not shown — omit it unless true) says production's HOST opens EVERY conversation
# (a page render, a greeting): turn 0 is the agent's opener and the scenario's first_talk is turn 1.
# It implies `may_open: true`.
# Scoped to MESSAGE CONTENT: a value the agent reads from its context (a `page_context`
# precondition) belongs under `agent_context:` above and must not be declared twice.
# There is no `output:` here — `render_actions:` is that declaration. Omit the whole block when
# this agent takes plain text turns, is handed no document and never opens the conversation,
# which is the default.
# A bench that is handed documents MUST list `file` (and `image_url` when it reads image parts):
# the SDK fails a scenario whose user line carries an undeclared part kind as
# `harness_undeclared_input`. Only this ROOT key is read; `agent: {io: ...}` declares nothing.
# On a `shape: pipeline` bench it is INERT — a one-shot hop has no conversation to open and no
# message parts to carry — so verify_config.py WARNS on that pair rather than refusing it: a
# harness may export both hooks, and `shape` names the route this run takes.
agent.io:
  input: [text]           # e.g. [text, file] for an agent that reads an attached document
  may_open: false

# --- Closed-class detectors (OPTIONAL) ---
# `<entity>.<field>` -> the regex that recognises a member of that CLOSED SET. A closed set is a
# value list the customer's sources enumerate exhaustively — every order code, every documentation
# URL, every person on a roster — which licenses a judge to treat a value outside it as one the
# sources never declared. The PRD's `## Agent facts` is where the set is DECLARED (a `data_profile`
# / `closed_set` fact, with `detector.required: true|false`); this key is where you say what a
# member LOOKS like when the backend cannot work it out from the members alone.
#
# It is VALIDATED, never trusted. The same six gates run against your pattern as against a derived
# one — unanimity, sample floor, specificity measured over your own prose, script agreement,
# silence on the sources, and a positive control against the fact's `detector.negatives`. A pattern
# that fires on your own documentation is REFUSED, with the offending sentence quoted. So supply it
# when you know the format and the derived ladder was refused; do not supply it to get past a
# refusal, because the refusal is usually the class not being as closed as it looks.
#
# ONE asymmetry: a pattern you DECLARE answers the pre-validated sample floor (3 members), not the
# induction floor (8 members over 2 record families) — that floor exists to justify INFERRING a
# skeleton from the members, and you did not infer it. A SKU catalog is usually one file, which is
# one family, so holding your own declaration to that floor would refuse it for a reason that has
# nothing to do with your pattern.
#
# The subject must match a `closed_set` fact's `subject:` in simulation_prd.md. One that matches
# none is a fix-first finding, not a silent no-op.
#
# Omit the key entirely when you have nothing to declare. A malformed declaration is a hard usage
# error in both scan shells, never "no override".
closed_class_detectors:
  invoice.reference: '^INV-[0-9]{6}$'

# --- Tools ---
tools:
  get_user_profile:
    mode: mock
    # C12: where the mock cuts in — transport | client | entity | tool_body: the lowest call whose arguments are
    # plain typed values, not an encoded wire payload. `client` (the SDK / wrapper method, or an installed tool
    # class's `_run` when every call below it is encoded) is the default; `transport` when the agent's own code
    # makes the wire call, or when `payload_codecs` declares every encoded field. `tool_body`
    # adds `seam_reason` (inline_external_call | hosted_body | unpatchable_write) and `skipped_code: [<path:line>]`.
    # A field the wire carries encoded is declared beside `seam:` (never inside `descriptor:`), decoded in list
    # order (`mime` last, `[*]` for each list item); `descriptor.args` / `returns` then describe the DECODED shape —
    # base64 / base64url: the bytes as text; json: the parsed value; form_urlencoded: a flat {key: value} mapping;
    # mime: {headers: {Name: value}, body: <text>, html?: <html>}, with no `attachments` on a reply:
    #   payload_codecs:
    #     - {at: args.body.message.raw, codec: [base64url, mime]}
    #     - {at: returns.raw, codec: [base64url, mime]}   # a return path never ends in bare `base64` / `base64url`
    #   so the mock answers `raw` as {headers: {To: a@example.com, Subject: Hi}, body: "Hello"} and the harness encodes it.
    # A seam mock that a REAL tool calls through (a `transport` entry for the HTTP call a `mode: real` tool
    # makes) names that tool and the line that makes the call, so the tool's trace facts reach this mock:
    #   serves: [alphavantage_global_quote]
    #   serves_cite: agent/quotes.py:12
    # A mock named for the tool it replaces, like this one, declares neither.
    seam: client
    # How the REAL tool reports the failure the mock models (a sibling of `descriptor:`, like
    # `invocation:`): `raises` (it raises / throws) or `returns` (it hands back a failure value,
    # e.g. `{error: ...}`). `error_channel_source` is the evidence rung it was read from, in order:
    # `trace` (a production trace shows the failure), `declared` (the tool's docstring, schema or
    # annotation says so), or `inferred` (read from its code — a suspect the quality loop re-checks).
    # The harness's mocked wrapper fails the way this says; absent, a failed mocked call is handed
    # to the agent as a value. verify_config warns on a mocked tool that declares none.
    error_channel: raises
    error_channel_source: declared
    # `invocation: fixed` (a sibling of `descriptor:`) declares a tool the agent's own code calls on
    # EVERY run, whatever the model decides — a pipeline's fixed first step. This tool is selected by
    # the model, so it is `agent`, which is the default: leave the key out.
    # invocation: fixed
    descriptor:
      description: "Fetch user profile from production Postgres users table"
      original_module: our_backend.db.queries
      original_function: get_user_profile
      reads_from: "Postgres users table joined with accounts table"
      writes_to: null
      stateful: false
      args:
        user_id: { type: str, description: "UUID of the user" }
      # returns.type / type_source / evidence (and args.<a>.nullable) are written from the tool's
      # code — for a Python agent by derive_tool_facts.py --write, never by hand. Elsewhere a return
      # annotation is `type_source: annotation` with `evidence`, and a tool nothing types is
      # `type: unknown`, `type_source: declared_unknown`, with its `unknown_reason`:
      #   returns: {type: dict, type_source: annotation, evidence: ["<file>:<line>"]}
      #   returns: {type: unknown, type_source: declared_unknown, unknown_reason: "<why nothing types it>"}
      returns:
        type: dict
        type_source: code
        evidence: [our_backend/db/queries.py:41]
        fields:
          # A field cited at a file:line is `declared`; one with no `evidence` stays `inferred`.
          # `max_chars: <int>` (optional, on `fields` or `item_fields`) declares that the real tool or its provider
          # truncates this string field to that length; its `evidence` cites the line that truncates it or reads the
          # provider's truncated field. The mock serves the field cut to it. Omit it when nothing truncates.
          id: { type: str, description: "user UUID", evidence: "our_backend/db/queries.py:44" }
          name: { type: str, description: "full name" }
          email: { type: str, description: "email address" }
          plan: { type: str, enum: [free, pro, enterprise] }
          balance: { type: float, description: "account balance in USD", min: 0 }
          created_at: { type: str, description: "ISO timestamp" }
      agent_usage: "Agent reads name, plan, balance to decide refund eligibility"
      business_rules: []
      error_cases:
        - condition: "user not found"
          returns: { error: "User not found" }
      depends_on: []
      depended_by: [process_refund, check_eligibility]

  process_refund:
    mode: mock
    seam: transport
    descriptor:
      description: "Process a refund through Stripe payment gateway"
      original_module: our_backend.services.payments
      original_function: process_refund
      reads_from: "Stripe API + Postgres users table"
      writes_to: "Stripe (creates refund) + Postgres (updates balance, creates transaction)"
      stateful: true
      args:
        user_id: { type: str, description: "UUID of the user" }
        amount: { type: float, description: "refund amount in USD" }
      returns:
        type: dict
        type_source: code
        evidence: [our_backend/services/payments.py:88, our_backend/services/payments.py:102]
        fields:
          status: { type: str, enum: [approved, rejected, pending_review] }
          refund_id: { type: str, description: "Stripe refund ID" }
          new_balance: { type: float, description: "balance after refund" }
          rejection_reason: { type: str, description: "only present if rejected" }
      agent_usage: "Agent checks result['status'], shows result['new_balance'] to user"
      business_rules:
        - "Premium users: full refund up to $500 without approval"
        - "Free users: store credit only, no cash refund"
        - "Max 2 refunds per session before requiring review"
        - "Balance must be >= refund amount"
      # Pre/post-conditions are the machine-readable spec the rich BACKEND
      # mock generator consumes. The customer's dumb inline mock in
      # simulate.py doesn't have to satisfy these — the backend's generated
      # mock does. test_mock_contract.py asserts post_conditions are met.
      pre_conditions:
        # FieldPresence — arg must be set (and truthy).
        - {field: user_id, must_be_present: true}
        # FieldSatisfies — boolean expression over args.
        - {field: amount, must_satisfy: "amount > 0"}
        # EntityExistence — an entity must exist at the arg-referenced id.
        - {entity_type: user, must_exist_with_id: user_id}
        # EntityCollectionSatisfies — predicate over the entire collection
        # of entities of this type (use for "must be non-empty" / "size N+").
        - {entity_type: transaction, must_satisfy: "len(transactions_for_user) <= 2"}
      post_conditions:
        # EntityFieldChange — arithmetic delta on an entity field.
        - {entity_type: user, field: balance, change: "-amount"}
        - {entity_type: user, field: refund_count, change: "+1"}
        # EntityCountChange — new entity created (optional seed fields).
        - {entity_type: transaction, count_change: "+1", with_fields: {type: refund, amount: amount}}
        # StateFieldSetter — return-value field gets a literal/arg value.
        - {state_field: status, set_to: approved}
        # StateFieldChange — return-value field changes non-deterministically
        # (free-form prose; use when set_to can't capture the change shape).
        - {state_field: messages, change: "append confirmation ToolMessage with refund_id"}
      state_transitions:
        user.balance: "decremented by amount"
        user.refund_count: "incremented by 1"
        creates: "transaction entity with type=refund"
      error_cases:
        - condition: "user not found"
          returns: { status: rejected, rejection_reason: "User not found" }
        - condition: "insufficient balance"
          returns: { status: rejected, rejection_reason: "Insufficient balance" }
        - condition: "free user"
          returns: { status: rejected, rejection_reason: "Store credit only" }
      depends_on: [get_user_profile]
      depended_by: [get_transactions]
    # The agent-state keys the REAL body writes on success besides its message (a LangGraph
    # `Command(update={...})`): `{value: <literal>}` | `{from_result: <returns field>}` |
    # `{omit: <reason>}`. The mock wrapper lands them. Omit the block when it writes none.
    # A from_result key the model never sees is declared under `returns.state_fields`.
    state_updates:
      last_refund_id: {from_result: refund_id}
      last_error: {value: null}

  get_transactions:
    mode: mock
    seam: client
    descriptor:
      description: "Get transaction history from Postgres transactions table"
      original_module: our_backend.db.queries
      original_function: get_transactions
      reads_from: "Postgres transactions table filtered by user_id"
      writes_to: null
      stateful: false
      args:
        user_id: { type: str, description: "UUID of the user" }
      returns:
        type: list
        type_source: annotation
        evidence: [our_backend/db/queries.py:57]
        item_fields:
          id: { type: str }
          amount: { type: float }
          type: { type: str, enum: [charge, refund, subscription] }
          status: { type: str, enum: [completed, pending, failed] }
          created_at: { type: str }
      agent_usage: "Agent iterates results, shows list to user, references by ID"
      depends_on: [process_refund]
      depended_by: []

  rag_search:
    mode: observe
    descriptor:
      description: "Search internal knowledge base via RAG endpoint"
      original_module: our_backend.rag.search
      original_function: search
      reads_from: "Azure AI Search index 'help-center'"
      writes_to: null
      # Observe-mode tools run for real and capture results to world-state;
      # mark the read explicitly as real to keep the env-generator from
      # second-guessing and the verifier from demanding a stub.modules entry.
      read_strategy: real
      stateful: false
      args:
        query: { type: str, description: "search query" }
      returns:
        type: "list[dict]"
        item_fields:
          title: { type: str }
          content: { type: str }
          score: { type: float }
      agent_usage: "Agent reads top results, uses content to answer user question"
    observer:
      # Capture real search results into WorldState for downstream mocks
      captures:
        - entity_type: search_result
          id_from: "index in result list"
          fields:
            query: "args.query"
            title: "result[i].title"
            content: "result[i].content"
            score: "result[i].score"
    credentials:
      api_key: "${RAG_TEST_API_KEY}"

  semantic_lookup:
    mode: real
    descriptor:
      description: "Vector-similarity search against a public KB index"
      original_module: our_backend.knowledge.vector_lookup
      original_function: semantic_search
      reads_from: "Public knowledge-base vector index (read-only)"
      writes_to: null
      # Run the tool body for real AND hit the real vector index. The
      # customer is testing how the agent uses real KB results; no need
      # to mock the index. Verifier exempts this tool from
      # stubs.modules + storage-monkey-patch requirements.
      read_strategy: real
      stateful: false
      args:
        query: { type: str }
        top_k: { type: int }
      returns:
        type: "list[dict]"
        item_fields:
          title: { type: str }
          snippet: { type: str }
          score: { type: float }
      agent_usage: "Agent picks the top result and quotes its snippet."
      depends_on: []
      depended_by: []

  update_transaction_status:
    mode: real
    # A REAL tool over a faked store — and not a contradiction: `mode` picks whose LOGIC runs (the
    # tool's real body: its validation, branching, error messages); the store call that body makes is
    # answered by the `entity` seam mock below, which names this tool in `serves:`. So it declares no
    # `reads_from` / `writes_to` and no strategy: its I/O is the seam mock's. ONE ROUTE PER STORE — a real
    # tool reaches a faked store only through a seam mock that serves it, never through a storage class
    # the harness writes (`verify_config.py` flags that as `world_served_without_mock`).
    # `read_strategy: real` (above) is how a tool whose store is REAL says so.
    observation_lane: tool_trail
    descriptor:
      description: "Set a transaction's status"
      original_module: our_backend.db
      original_function: update_transaction_status
      stateful: true
      args:
        transaction_id: { type: str }
        status: { type: str }
      returns:
        type: dict
        fields:
          transaction_id: { type: str }
          status: { type: str }
      agent_usage: "Agent confirms the new status in one sentence."
      depends_on: []
      depended_by: []

  transactions_set_status:
    mode: mock
    # The store's row write, mocked at the `entity` seam (the accessor the real tool's body calls).
    # `serves` names every real tool whose code reaches this call, `serves_cite` the line that makes it.
    # A behaviour the store has (a status transition it refuses, a version it bumps) is THIS mock's
    # contract, written as `business_rules` and pinned by its contract tests — never harness code.
    seam: entity
    serves: [update_transaction_status]
    serves_cite: our_backend/db.py:88
    error_channel: raises
    error_channel_source: declared
    descriptor:
      description: "Write one transaction row's status in the Transactions table"
      original_module: our_backend.db.queries
      original_function: set_transaction_status
      reads_from: "Transactions table (Postgres)"
      writes_to: "Transactions table"
      stateful: true
      args:
        transaction_id: { type: str }
        status: { type: str }
      returns:
        type: dict
        type_source: annotation
        evidence: [our_backend/db/queries.py:88]
        fields:
          transaction_id: { type: str }
          status: { type: str }
      agent_usage: "update_transaction_status reads the stored status back and confirms it."
      post_conditions:
        # Return-value field ← arg value (StateFieldSetter), then the WORLD write the
        # description promises (EntityFieldSetter) — a write tool that declares only a
        # payload field gives the backend no state transition to mock.
        - state_field: status
          set_to: status
        - entity_type: transaction
          field: status
          set_to: status
      depends_on: []
      depended_by: []

  send_notification:
    mode: mock
    seam: transport
    descriptor:
      description: "Send SMS notification via Twilio"
      original_module: our_backend.services.twilio
      original_function: send_sms
      reads_from: null
      writes_to: "Twilio API (sends SMS)"
      stateful: false
      args:
        user_id: { type: str }
        message: { type: str }
      returns:
        type: dict
        type_source: code
        evidence: [our_backend/services/twilio.py:23]
        fields:
          status: { type: str, enum: [sent, failed] }
      agent_usage: "Agent just checks status == 'sent'"
      # writes_to is non-null (we're sending an SMS via Twilio) → schema
      # requires post_conditions. The send is a `user_delivery` row: the row the
      # `sms_inbox` surface below shows the simulated user, so the post_condition
      # that creates it is what lets the SMS reach the simulated user.
      post_conditions:
        - {entity_type: user_delivery, count_change: "+1", with_fields: {channel: sms, body: message}}
        - {state_field: status, set_to: sent}
      state_transitions:
        creates: "user_delivery row: channel sms, `to` = the user's phone, body = message"
      depends_on: []
      depended_by: []

# --- WorldState ---
# Entity types and their schemas. Initial data for mock tools.
# Scenarios can override with specific values.
world_state:
  # WHO OWNS the state a scenario mutates — `mock` (default) | `agent` | `external`.
  # OMIT IT unless the answer is not `mock`: an absent key means `mock`, which is what
  # this example's agent is (every record it reads is in the mock's world, and the backend
  # opens a fresh mock session per scenario and seeds it, so nothing carries over).
  #
  # Declare `agent` when the agent's OWN process owns the store (its checkpointer's
  # database, a file it writes, a local index), `external` when a real system behind it
  # does (a CRM, a shared database, a server-side conversation store). Neither is reset
  # by anything the run controls: only the two things above are reset per scenario, so
  # scenario 2 would open on scenario 1's writes and every verdict would be partly about
  # the order the scenarios ran in — on a run that completes GREEN.
  #
  # So a bench declaring either one must export `reset() -> None` at simulate.py's module
  # scope, clearing the stores it owns. The runner calls it in the child before every
  # scenario (after the mock session is opened, before `seed_state` puts the scenario's
  # preconditions in); a declared non-mock world with no `reset` is refused at RUN START,
  # before a thread is opened. verify_config.py refuses an owner outside the three words;
  # the Python sub-skill's verify_simulate.py refuses the missing hook.
  #
  # owner: external
  # Beside `external` or `agent`: N identical copies of the store, indexed by PLURAI_WORLD_SLOT.
  # Without it an external store runs one attempt at a time; an agent store at a fixed path
  # (a file, SQLite, a local index) must declare it — `1` runs one attempt at a time.
  # slots: 3
  #
  # A SPLIT world — the harness's own store holds some entity types and the mock holds the
  # rest — declares the types its store holds. `world_snapshot()` then returns ONLY the
  # store's rows; the run composes them with the mock's rows of every other type, in one
  # place. Never merge `plurai.world_state_snapshot()` into the hook by hand: the mock's
  # seeded copy of a record your store re-keyed would be scored beside the live one.
  # owned_types: [transaction]
  #
  # ONLY on the user's explicit opt-in at the scan's approval question ("keep live: conversations
  # will see each other's writes"): live writes on a world nothing resets per conversation. The run
  # then proceeds instead of being held, carrying the named risk `shared_world` (capped at qualified).
  # shared_world_ok: true
  entity_types:
    user:
      description: "User account"
      # `required:` on EVERY field (verify_config refuses one without it): `true` on every field
      # the agent or harness reads without a default — its ids, what the harness's storage reads
      # with a fail-closed guard or a bare `row["f"]`, the record model's non-defaulted fields —
      # and `false` on the rest. The backend carries it onto the generated world schema, so a
      # scenario can never seed a row the harness refuses.
      fields:
        id: { type: string, required: true }
        name: { type: string, required: true }
        email: { type: string, required: true }
        phone: { type: string, required: false }
        plan: { type: string, enum: [free, pro, enterprise], required: true }
        balance: { type: float, min: 0, required: true }
        refund_count: { type: int, min: 0, required: true }
        created_at: { type: string, required: false }
        # Rows held inline: type every row field under `item_specs` (verify_config refuses a bare `list[dict]`).
        addresses: { type: "list[dict]", required: false, item_specs: { line1: { type: string, required: true }, postcode: { type: string, required: false } } }
      default_entity:
        user_123:
          _entity_type: user
          name: "Alice"
          email: "alice@example.com"
          phone: "+1 555 010 4477"
          plan: premium
          balance: 347.0
          refund_count: 0

    transaction:
      description: "Payment transaction"
      fields:
        id: { type: string, required: true }
        amount: { type: float, required: true }
        type: { type: string, enum: [charge, refund, subscription], required: true }
        status: { type: string, enum: [completed, pending, failed], required: true }
        # `references: user` resolves by the row's own id: `user` has `id`. A referenced type
        # whose own id is spelled otherwise declares it: `id_field: <field>` (or `id_field: null`).
        user_id: { type: string, references: user, required: true }
        created_at: { type: string, required: false }
      # Data invariants every REAL row holds, copied verbatim from `scripts/measured_candidates.py`
      # (never written by hand: verify_config re-measures each one on the file its `source` cites):
      # checks:
      #   - when: { <boolean field>: true }
      #     then: { "<field or list[].field>": <value> }   # or { in: [...] }, or { expr: "<computed from the row>" }
      #     source: "<data file>#<list>"                   # + " (members: <file>#<list>.<field>)" for an `in` set
      # A simulated type whose rows are copied from a list the agent only reads (a catalog, a code table) names it:
      # reference_rows: "<data file>[#<list>]"
      default_entity:
        txn_001:
          _entity_type: transaction
          amount: 349.0
          type: charge
          status: completed
          user_id: user_123

    user_delivery:
      description: "A message the product sends a person (here: the SMS send_notification sends)"
      fields:
        id: { type: string, required: true }
        channel: { type: string, required: false }
        to: { type: string, required: true }
        subject: { type: string, required: false }
        body: { type: string, required: true }
      # No default — written at runtime by send_notification

    search_result:
      description: "Captured from real rag_search via observer"
      fields:
        query: { type: string, required: true }
        title: { type: string, required: true }
        content: { type: string, required: true }
        score: { type: float, required: false }
      # No default — populated at runtime by observer

  # What a PERSON sees in the product (`kind: screen`) or receives from it (`email`,
  # `text_message`, `notification`, `shared_with_me`), read from the product's own UI and send
  # code. OMIT the key when undeclared; `user_surfaces: []` says nothing reaches the user outside
  # the chat. SKILL.md Step 8 states the rules; verify_config.py validates every field below
  # against `entity_types` and refuses a delivery surface no tool's post_conditions write.
  user_surfaces:
    - name: transaction_history
      kind: screen
      title: Transactions            # the product's own name for the view
      rows: transaction              # entity rows; `<type>[<selector>].<list_field>` for rows held in a list field (+ row_key)
      shown_fields: [created_at, type, amount, status]
      order: newest_first            # stored | newest_first: the product's default order
    - name: sms_inbox
      kind: text_message
      title: Text messages
      rows: user_delivery
      recipient_field: to            # the address the row is sent to; matched against the user's own contacts
      shown_fields: [body]
      order: newest_first

# --- Tool relationships ---
# How tools connect through shared WorldState entities.
tool_graph:
  - source: get_user_profile
    target: process_refund
    shared_entity: user
    relationship: "process_refund reads user.balance to check sufficient funds"

  - source: process_refund
    target: get_transactions
    shared_entity: transaction
    relationship: "process_refund creates a transaction, get_transactions lists them"

  - source: process_refund
    target: get_user_profile
    shared_entity: user
    relationship: "process_refund updates user.balance, subsequent get_user_profile reflects new balance"

  - source: rag_search
    target: send_notification
    shared_entity: search_result
    relationship: "Agent uses rag_search results to compose notification message"

  - source: transactions_set_status
    target: get_transactions
    shared_entity: transaction
    relationship: "a status the seam mock writes is listed by get_transactions"

  # A mocked write tool nothing reads back says so; its readers otherwise sit on its side of the mock.
  - source: send_notification
    target: null
    relationship: "the SMS leaves the system; no tool reads it back"

# --- Stubs ---
# Import-time stubs. Documented for reproducibility.
stubs:
  modules:
    - module: our_backend.db
      reason: "SQLAlchemy get_db_session() connects to Postgres at import time"
      # Declares this stub as a STORE's module. Its rows are served by the `transactions_set_status`
      # seam mock (which `serves:` the real tool), so the stub only keeps the import-time connect
      # from running. A shared package name alone is not a storage signal; this declaration is.
      role: storage
    - module: our_backend.redis
      reason: "Redis client connects at import time"
      # A non-storage role answers the same question the other way: this module shares the
      # reading tool's package root, and saying what it IS keeps verify_config from warning
      # that it cannot tell.
      role: cache
    - module: our_backend.services
      reason: "Stripe/Twilio clients read API keys from env at import time"
      role: client
  env_vars:
    - var: STRIPE_KEY
      reason: "PaymentService constructor reads this"
  post_import_patches: []

# --- Egress ---
# Written by /simulation-scan-agent Step 3d via scripts/record_egress.py, and read by the SDK:
# it blocks each declared host inside a guarded Python agent's process during a run, and holds a
# run whose declared host is REACHABLE from this machine when nothing enforces that. The harness
# redirects a base URL, so an endpoint the agent holds in its own code is not redirected and a
# simulated user would drive a real write.
# BEGIN plurai-simulation egress rev 1 (managed — rewritten by /simulation-scan-agent)
egress:
  production_hosts:
    - host: api.billing.acme.internal
      source: our_backend/services.py:31
      port: 443
  discovery:
    status: declared
    scanned:
      - agent.py
      - our_backend/services.py
      - config/settings.yaml
  agent_runtime: python_child
  # OPTIONAL `allow_hosts: [<host>]`: declared, but deliberately reachable in this environment —
  # the operator's waiver. A re-scan that omits the key keeps it; `allow_hosts: []` clears it.
# END plurai-simulation egress
